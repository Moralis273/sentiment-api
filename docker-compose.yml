services:
  postgres:
    image: postgres:16
    container_name: my-postgres
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydb
    ports: 
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: api-sentiment
    ports: 
      - "8000:8000"
    environment:
      DB_HOST: postgres
      DB_PORT:  5432
      DB_NAME:  mydb
      DB_USER: myuser
      DB_PASSWORD:  mypassword
    depends_on:
      - postgres
volumes:
  postgres_data:
